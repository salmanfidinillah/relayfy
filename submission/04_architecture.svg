<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">Relayfy: access, agent and approval boundaries</title><desc id="desc">Web sessions authorize sources before retrieval. A scoped loopback worker processes one job. Server validates the reply, and human confirmation is required for sharing and acceptance.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#ee774f" stroke-width="1.4"/></marker></defs><rect width="1600" height="1120" fill="#171819"/><g font-family="Helvetica, Arial, sans-serif"><text x="56" y="57" fill="#ee774f" font-size="14" letter-spacing="3">RELAYFY / MVP 0.3</text><text x="56" y="112" fill="#f0f0f1" font-size="36" font-weight="bold">Bukti dulu. Agent bekerja. Manusia memutuskan.</text><text x="56" y="147" fill="#a1a2a6" font-size="17">Jalur demo lokal melalui WorkBuddy. Seluruh bahan sintetis; bukan diagram deployment publik.</text><rect x="40" y="195" width="430" height="770" rx="14" fill="#1c1d1f" stroke="#343639"/><text x="65" y="235" fill="#ee774f" font-size="13" letter-spacing="2">01  WEB</text><text x="65" y="267" fill="#a1a2a6" font-size="16">Sesi pengguna / profil demo lokal</text><rect x="530" y="195" width="520" height="770" rx="14" fill="#1c1d1f" stroke="#343639"/><text x="555" y="235" fill="#ee774f" font-size="13" letter-spacing="2">02  SERVER RELAYFY</text><text x="555" y="267" fill="#a1a2a6" font-size="16">Python WSGI + SQLite</text><rect x="1110" y="195" width="450" height="770" rx="14" fill="#1c1d1f" stroke="#343639"/><text x="1135" y="235" fill="#ee774f" font-size="13" letter-spacing="2">03  WORKBUDDY</text><text x="1135" y="267" fill="#a1a2a6" font-size="16">Task baru untuk setiap konteks akses</text><rect x="65" y="310" width="380" height="112" rx="9" fill="#242629" stroke="#303235"/><text x="83" y="342" fill="#f0f0f1" font-size="19" font-weight="bold">Masuk dan ajukan permintaan</text><text x="83" y="372" fill="#aeb0b3" font-size="14">Dokumen, chat, task manual</text><text x="83" y="396" fill="#aeb0b3" font-size="14">Cookie HttpOnly; origin dan CSRF</text><rect x="560" y="310" width="460" height="112" rx="9" fill="#242629" stroke="#303235"/><text x="578" y="342" fill="#f0f0f1" font-size="19" font-weight="bold">Identitas → membership → ACL</text><text x="578" y="372" fill="#aeb0b3" font-size="14">Diperiksa sebelum retrieval</text><text x="578" y="396" fill="#aeb0b3" font-size="14">Brief: akses penerima ∩ pemberi</text><rect x="560" y="475" width="460" height="112" rx="9" fill="#242629" stroke="#303235"/><text x="578" y="507" fill="#f0f0f1" font-size="19" font-weight="bold">Antrean bukti berizin</text><text x="578" y="537" fill="#aeb0b3" font-size="14">Key: akun / workspace / revisi / tujuan</text><text x="578" y="561" fill="#aeb0b3" font-size="14">Lease terbatas; token disimpan hash</text><rect x="1140" y="475" width="390" height="112" rx="9" fill="#242629" stroke="#303235"/><text x="1158" y="507" fill="#f0f0f1" font-size="19" font-weight="bold">next → model → finish</text><text x="1158" y="537" fill="#aeb0b3" font-size="14">CLI Python atau empat tools MCP</text><text x="1158" y="561" fill="#aeb0b3" font-size="14">Evidence sebagai data, bukan instruksi</text><rect x="560" y="640" width="460" height="112" rx="9" fill="#242629" stroke="#303235"/><text x="578" y="672" fill="#f0f0f1" font-size="19" font-weight="bold">Validasi balasan dan akses ulang</text><text x="578" y="702" fill="#aeb0b3" font-size="14">JSON, citation, exact quote, lease</text><text x="578" y="726" fill="#aeb0b3" font-size="14">Tolak hasil jika revisi/izin berubah</text><rect x="65" y="640" width="380" height="112" rx="9" fill="#242629" stroke="#303235"/><text x="83" y="672" fill="#f0f0f1" font-size="19" font-weight="bold">Jawaban atau draf privat</text><text x="83" y="702" fill="#aeb0b3" font-size="14">Kutipan dapat diperiksa</text><text x="83" y="726" fill="#aeb0b3" font-size="14">Belum dibagikan sebelum review</text><rect x="65" y="810" width="380" height="112" rx="9" fill="#242629" stroke="#87623f"/><text x="83" y="842" fill="#f0f0f1" font-size="19" font-weight="bold">Preview + konfirmasi manusia</text><text x="83" y="872" fill="#aeb0b3" font-size="14">Review/share, klarifikasi, accept</text><text x="83" y="896" fill="#aeb0b3" font-size="14">Worker tidak memiliki tool approval</text><rect x="560" y="810" width="460" height="112" rx="9" fill="#242629" stroke="#303235"/><text x="578" y="842" fill="#f0f0f1" font-size="19" font-weight="bold">Transaksi versi dan audit</text><text x="578" y="872" fill="#aeb0b3" font-size="14">Cek actor / revisi / brief terbaru</text><text x="578" y="896" fill="#aeb0b3" font-size="14">SQLite persisten; audit UI sesuai izin</text><path d="M445 366H558" fill="none" stroke="#ee774f" stroke-width="2" marker-end="url(#arrow)"/><path d="M790 422V473" fill="none" stroke="#ee774f" stroke-width="2" marker-end="url(#arrow)"/><path d="M1020 531H1138" fill="none" stroke="#ee774f" stroke-width="2" marker-end="url(#arrow)"/><path d="M1335 587V696H1022" fill="none" stroke="#ee774f" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 696H447" fill="none" stroke="#ee774f" stroke-width="2" marker-end="url(#arrow)"/><path d="M255 752V808" fill="none" stroke="#ee774f" stroke-width="2" marker-end="url(#arrow)"/><path d="M445 866H558" fill="none" stroke="#ee774f" stroke-width="2" marker-end="url(#arrow)"/><text x="1160" y="646" fill="#ee774f" font-size="14">HTTP loopback + bearer</text><text x="1140" y="770" fill="#a1a2a6" font-size="16">Tidak dapat:</text><text x="1140" y="804" fill="#d0d1d3" font-size="15">mengubah peran / ACL</text><text x="1140" y="834" fill="#d0d1d3" font-size="15">menyetujui handover</text><text x="1140" y="864" fill="#d0d1d3" font-size="15">meminta seluruh korpus</text><text x="1140" y="921" fill="#9d9fa3" font-size="13">Shell OS tetap memerlukan isolasi.</text><text x="56" y="1011" fill="#e0be73" font-size="16">Perubahan sumber / izin → revisi baru → job, brief, history dan plan lama ditolak.</text><text x="56" y="1046" fill="#a1a2a6" font-size="15">Task dan pairing WorkBuddy baru wajib. Server tidak dapat menghapus data yang pernah dilihat model.</text><text x="56" y="1080" fill="#81848a" font-size="13">Adapter API opsional melewati antrean. Kutipan valid bukan jaminan semantik. Bukti aplikasi WorkBuddy aktual masih menunggu.</text><polyline points="548,361 558,366 548,371" fill="none" stroke="#ee774f" stroke-width="2"/><polyline points="795,463 790,473 785,463" fill="none" stroke="#ee774f" stroke-width="2"/><polyline points="1128,526 1138,531 1128,536" fill="none" stroke="#ee774f" stroke-width="2"/><polyline points="1032,701 1022,696 1032,691" fill="none" stroke="#ee774f" stroke-width="2"/><polyline points="457,701 447,696 457,691" fill="none" stroke="#ee774f" stroke-width="2"/><polyline points="260,798 255,808 250,798" fill="none" stroke="#ee774f" stroke-width="2"/><polyline points="548,861 558,866 548,871" fill="none" stroke="#ee774f" stroke-width="2"/></g></svg>